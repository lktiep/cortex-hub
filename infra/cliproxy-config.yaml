# CLIProxy API — Configuration
# Docs: https://github.com/nicepkg/CLIProxyAPI

# Server port
port: 8317
# Bind to all interfaces (for Docker)
host: ""
# Auth directory (persisted via Docker volume)
auth-dir: /CLIProxyAPI/auth
# Debug logging
debug: false
# Remote management (for onboarding via web)
remote-management:
  allow-remote: true
  # No secret-key here on purpose. CLIProxyAPI expands no env vars in this file,
  # so a "${MANAGEMENT_PASSWORD}" value was stored and bcrypt-hashed literally —
  # i.e. the repo itself published a working management credential for a
  # LAN-exposed, allow-remote endpoint. v7.3.18 also accepts the MANAGEMENT_PASSWORD
  # env var (docker-compose passes it from .env), which is the only credential we want.
# OpenAI-compatible endpoints: none here on purpose. For the same reason as the
# management key, an api-key written as "${OPENAI_API_KEY:-placeholder}" was sent
# to OpenAI literally: every model it declared (text-embedding-3-*, gpt-5.4-mini)
# was listed by /v1/models and answered 401 — including as a fallback in a chat
# routing chain. Nothing synced a real key into it. Add an API-key provider
# through the dashboard setup wizard, which writes it to the auth volume
# (auth-dir above) rather than to this bind-mounted, committed file.
