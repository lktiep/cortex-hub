# Cortex Hub — Docker Compose Stack
# Services: CLIProxy (LLM Gateway), Qdrant, GitNexus, Dashboard API, Hub MCP
# CLIProxy provides OpenAI-compatible API via OAuth — no API key required
# mem9 runs in-process within the Dashboard API container
# GitNexus runs as a standalone eval-server for code intelligence

services:
  # ─────────────────────────────────────────────
  # Qdrant — Vector Database
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: cortex-qdrant
    restart: unless-stopped
    # Loopback only: Qdrant has no authentication, and everything that needs it
    # (cortex-api, the embedder) reaches it over the compose network by name.
    # Published on 0.0.0.0 it let anyone on the LAN read, edit or drop every
    # memory and code vector in the stack.
    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    deploy:
      resources:
        limits:
          # Every branch of a project holds its own copy of the project's
          # points. Thirty branches of one repo came to ~350K points and kept
          # this container at 85% of a 1G limit, hitting it hundreds of
          # thousands of times. Raise it without editing this file.
          memory: ${QDRANT_MEMORY_LIMIT:-2G}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/6333) 2>/dev/null'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Ollama — Embedding Engine
  # 1fbfafc removed the in-process @xenova/transformers embedder and routed
  # every embedding through the LLM gateway, but never added the Ollama server
  # the gateway was meant to call. Without this service `model_routing` has
  # nothing to point at, so mem9 answers 503 "No embedding providers
  # configured" and every project card shows "Mem9 Error".
  #
  # No host port on purpose: only cortex-api talks to it, over the compose
  # network at http://ollama:11434/v1. Publishing 11434 would expose an
  # unauthenticated model runner on the LAN and to any tunnel route.
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.34.4
    container_name: cortex-ollama
    restart: unless-stopped
    # The entrypoint pins each model's threads to the CPU limit below (see the
    # script for why) and then execs `ollama serve`. init reaps its helper.
    init: true
    entrypoint: ["/bin/sh", "/cortex/ollama-entrypoint.sh"]
    volumes:
      - ollama-models:/root/.ollama
      - ./ollama-entrypoint.sh:/cortex/ollama-entrypoint.sh:ro
    environment:
      # Threads per model. Defaults to the CPU limit: llama.cpp otherwise runs
      # one thread per host CPU and spends the quota being throttled.
      CORTEX_OLLAMA_THREADS: ${OLLAMA_THREADS:-${OLLAMA_CPUS:-4}}
      # Two slots, matching EMBED_MAX_CONCURRENCY in the gateway. ollama
      # serialises embedding work internally — measured on this host, a search
      # that arrives while a 32-chunk batch is running waits out that batch
      # (~2.3s on four cores) — so extra slots buy no throughput and each one
      # costs context memory on a container already at its ceiling. What keeps
      # searches fast during an index is the gateway's query lane and small
      # index batches (MEM9_BATCH_SIZE, 8 by default), not more slots here.
      OLLAMA_NUM_PARALLEL: 2
      # Embedding models are small; keep them resident instead of paying the
      # load cost on every mem9 run.
      OLLAMA_KEEP_ALIVE: 24h
      # One. This host uses a single 384-dim embedding model, and room for a
      # second is what took the container to 3.978 GiB of its 4 GiB limit
      # (99.46%) — close enough that the next index gets OOM-killed mid-run.
      OLLAMA_MAX_LOADED_MODELS: 1
    deploy:
      resources:
        limits:
          # Raise on a host with spare RAM without editing this file.
          memory: ${OLLAMA_MEMORY_LIMIT:-4G}
          # Uncapped, a re-index of several branches held every core of the
          # host for hours and starved the API and Qdrant beside it. On four
          # cores, with threads pinned to match, an 8-chunk index batch takes
          # ~0.3s, which is also the longest a search waits behind one. Raise it
          # on a host that does nothing else.
          cpus: ${OLLAMA_CPUS:-4}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # CLIProxy — LLM Gateway (OAuth-based)
  # API:  http://localhost:8317/v1 (OpenAI-compatible)
  # Zero SQL, zero Redis — just config + OAuth tokens
  # ─────────────────────────────────────────────
  llm-proxy:
    image: eceasy/cli-proxy-api:latest
    container_name: cortex-llm-proxy
    restart: unless-stopped
    # No host port on purpose. CLIProxyAPI serves /v1 with no auth (api-keys
    # must be literal in config.yaml, which is bind-mounted from this repo, so
    # a key here would be published like the one 99c58b9 removed). Publishing
    # 8317 on the host also handed it to the Cloudflare Tunnel connector, which
    # served cortex-llm.jackle.dev to the internet unauthenticated -- anyone
    # knowing the hostname could spend the account's quota. Every consumer
    # (cortex-api, hub-mcp) reaches it over the compose network instead:
    #   OPENAI_API_BASE=http://llm-proxy:8317/v1   CLIPROXY_URL=http://llm-proxy:8317
    # Re-exposing it means adding api-keys via a rendered, git-ignored config.
    volumes:
      - cliproxy-auth:/CLIProxyAPI/auth
      - ./cliproxy-config.yaml:/CLIProxyAPI/config.yaml
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: Asia/Ho_Chi_Minh
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:?Set MANAGEMENT_PASSWORD in .env}
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      # The eceasy/cli-proxy-api image ships no wget or curl — probe the port with bash.
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/8317) 2>/dev/null'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # GitNexus — Code Intelligence Service
  # API:  http://localhost:4848 (eval-server)
  # Provides: AST graph search, impact analysis, symbol context
  # ─────────────────────────────────────────────
  gitnexus:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gitnexus
      network: host
    image: ${CORTEX_IMAGE_NAMESPACE:-ghcr.io/lktiep}/cortex-gitnexus:latest
    container_name: cortex-gitnexus
    restart: unless-stopped
    labels:
      # Watchtower reads com.centurylinklabs.*, never com.containrrr.* — the
      # label this used to carry was inert, so with WATCHTOWER_LABEL_ENABLE the
      # monitored set was empty and nothing on this host has ever auto-updated.
      - "com.centurylinklabs.watchtower.enable=true"
    # Loopback only: cortex-api talks to GitNexus over the compose network.
    ports:
      - "127.0.0.1:4848:4848"
    volumes:
      - api-data:/app/data
      - gitnexus-data:/root/.gitnexus
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      PORT: 4848
      # Bootstrap repo indexed on a fresh volume. eval-server refuses to stay up
      # with an empty registry, so without at least one repo gitnexus crash-loops.
      DEFAULT_REPO: ${DEFAULT_REPO:-}
      # eval-server 1.6.12+ refuses --host 0.0.0.0 without a bearer token. Leave
      # this empty and the entrypoint generates one onto the shared api-data
      # volume, where dashboard-api picks it up.
      GITNEXUS_AUTH_TOKEN: ${GITNEXUS_AUTH_TOKEN:-}
      # LadybugDB buffer pool per repository eval-server holds open (it keeps up to
      # five). Unset, GitNexus sizes it from the host's RAM, not this container's.
      GITNEXUS_SERVE_BUFFER_POOL_SIZE: ${GITNEXUS_SERVE_BUFFER_POOL_SIZE:-536870912}
      # Watchdog: seconds before a failed analyze is retried (doubling per attempt,
      # up to the max), and how long one analyze may run.
      GITNEXUS_ANALYZE_RETRY_BASE: ${GITNEXUS_ANALYZE_RETRY_BASE:-300}
      GITNEXUS_ANALYZE_RETRY_MAX: ${GITNEXUS_ANALYZE_RETRY_MAX:-21600}
      GITNEXUS_ANALYZE_TIMEOUT: ${GITNEXUS_ANALYZE_TIMEOUT:-3600}
      # analyze's heap and parse workers, kept within what eval-server leaves.
      GITNEXUS_ANALYZE_HEAP_MB: ${GITNEXUS_ANALYZE_HEAP_MB:-3072}
      GITNEXUS_ANALYZE_WORKERS: ${GITNEXUS_ANALYZE_WORKERS:-2}
    deploy:
      resources:
        limits:
          # eval-server (five pools of the size above plus its Node heap) and one
          # analyze at a time (a 3 GiB heap plus a pool sized to the repository).
          # 4G ran out on 2026-09-28 and took the watchdog down with it.
          memory: ${GITNEXUS_MEMORY_LIMIT:-6G}
    healthcheck:
      # The bearer token is enforced on /health too, so the probe must carry it.
      # It lives in a file because the entrypoint may have generated it at runtime.
      test: ["CMD-SHELL", "node -e \"const fs=require('fs');const f=process.env.GITNEXUS_AUTH_TOKEN_FILE||'/app/data/gitnexus-auth-token';const t=(process.env.GITNEXUS_AUTH_TOKEN||(fs.existsSync(f)?fs.readFileSync(f,'utf8'):'')).trim();fetch('http://localhost:4848/health',{headers:t?{Authorization:'Bearer '+t}:{}}).then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─────────────────────────────────────────────
  # Cortex Dashboard API (+ Dashboard Web static)
  # ─────────────────────────────────────────────
  cortex-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dashboard-api
      network: host
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
        BUILD_DATE: ${BUILD_DATE:-}
    image: ${CORTEX_IMAGE_NAMESPACE:-ghcr.io/lktiep}/cortex-api:latest
    container_name: cortex-api
    restart: unless-stopped
    labels:
      # Watchtower reads com.centurylinklabs.*, never com.containrrr.* — the
      # label this used to carry was inert, so with WATCHTOWER_LABEL_ENABLE the
      # monitored set was empty and nothing on this host has ever auto-updated.
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "4000:4000"
      - "3000:4000" # Backward compatibility for dashboard port
      # Cloudflare Tunnel origin. The remotely-managed "cortex-hub" tunnel
      # routes hub.jackle.dev -> http://localhost:3080, a port left over from
      # the separate dashboard-web container that 91c99f1 folded into this
      # service. Without this mapping the hostname answers 502.
      - "3080:4000"
    volumes:
      - api-data:/app/data
      - gitnexus-data:/root/.gitnexus
      - cliproxy-auth:/app/cliproxy-auth
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Docker socket removed — security risk (root access if API compromised)
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: 4000
      NODE_ENV: production
      DATABASE_PATH: /app/data/cortex.db
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-proxy-key}
      OPENAI_API_BASE: http://llm-proxy:8317/v1
      LLM_PROXY_URL: http://llm-proxy:8317
      CLIPROXY_AUTH_DIR: /app/cliproxy-auth
      CLIPROXY_MANAGEMENT_KEY: ${MANAGEMENT_PASSWORD:?Set MANAGEMENT_PASSWORD in .env}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:4000}
      # mem9 Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MEM9_LLM_MODEL: ${MEM9_LLM_MODEL:-}
      MEM9_EMBEDDING_MODEL: ${MEM9_EMBEDDING_MODEL:-gemini-embedding-001}
      # Embeddings are resolved from the model_routing table by the gateway, not
      # from env. EMBEDDING_PROVIDER and LOCAL_EMBEDDING_MODEL used to select an
      # in-process @xenova/transformers model; 1fbfafc deleted that code, so both
      # were silently doing nothing while still advertising a local embedder.
      OLLAMA_API_BASE: http://ollama:11434/v1
      # Reranking (optional). With no key, every search path keeps its current
      # pure-vector behaviour; with one, /api/intel/code-search over-fetches
      # candidates and reorders them with a TypeSafe Jev relevance decision.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      # GitNexus
      GITNEXUS_URL: http://gitnexus:4848
      # Matches the gitnexus service. When empty, dashboard-api reads the token
      # the gitnexus entrypoint wrote to the shared api-data volume.
      GITNEXUS_AUTH_TOKEN: ${GITNEXUS_AUTH_TOKEN:-}
    depends_on:
      qdrant:
        condition: service_healthy
      gitnexus:
        condition: service_started
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # Cortex Hub MCP Gateway (standalone)
  # ─────────────────────────────────────────────
  cortex-mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile.hub-mcp
      network: host
    image: ${CORTEX_IMAGE_NAMESPACE:-ghcr.io/lktiep}/cortex-mcp:latest
    container_name: cortex-mcp
    restart: unless-stopped
    labels:
      # Watchtower reads com.centurylinklabs.*, never com.containrrr.* — the
      # label this used to carry was inert, so with WATCHTOWER_LABEL_ENABLE the
      # monitored set was empty and nothing on this host has ever auto-updated.
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8318:8317"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: 8317
      NODE_ENV: production
      DASHBOARD_API_URL: http://cortex-api:4000
      QDRANT_URL: http://qdrant:6333
      CLIPROXY_URL: http://llm-proxy:8317
      GITNEXUS_URL: http://gitnexus:4848
      MCP_SERVER_NAME: "cortex-hub"
      # MCP_SERVER_VERSION comes from the image (the release it was built as).
      API_KEYS: ${MCP_API_KEYS:-}
    depends_on:
      cortex-api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      gitnexus:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8317/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # Watchtower — Auto-update containers
  # ─────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    container_name: cortex-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      # Opt-in only: the three cortex images carry the enable label, so the
      # pinned third-party images (qdrant, ollama) are never touched. This is
      # the whole of CD here — the build workflow publishes to GHCR and nothing
      # pushes to this host, which sits on a private LAN behind a tunnel.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Docker 29+ rejects API versions below 1.44.
      DOCKER_API_VERSION: "1.44"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  qdrant-data:
    name: cortex-qdrant-data
  api-data:
    name: cortex-api-data
  gitnexus-data:
    name: cortex-gitnexus-data
  cliproxy-auth:
    name: cortex-cliproxy-auth
  ollama-models:
    name: cortex-ollama-models
