name: Build and Publish Docker Images

on:
  push:
    branches: [master]
    paths:
      - 'apps/dashboard-api/**'
      - 'apps/dashboard-web/**'
      - 'apps/hub-mcp/**'
      - 'packages/**'
      - 'infra/Dockerfile.*'
      - 'infra/nginx-dashboard.conf'
      # Baked into cortex-gitnexus by COPY in Dockerfile.gitnexus, so editing it
      # is a source change that needs a rebuild — same as nginx-dashboard.conf.
      - 'infra/gitnexus-entrypoint.sh'
      - 'version.json'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Read current version ──
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: read
        run: |
          VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' version.json | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

  # ── cortex-api (dashboard-api) ──
  build-api:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/lktiep/cortex-api
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.dashboard-api
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-api
          cache-to: type=gha,scope=cortex-api,mode=max

  # ── cortex-hub-web (dashboard-web) ──
  build-web:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/lktiep/cortex-hub-web
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.dashboard-web
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-hub-web
          cache-to: type=gha,scope=cortex-hub-web,mode=max

  # ── cortex-mcp (hub-mcp) ──
  build-mcp:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/lktiep/cortex-mcp
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.hub-mcp
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-mcp
          cache-to: type=gha,scope=cortex-mcp,mode=max

  # ── cortex-gitnexus ──
  build-gitnexus:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/lktiep/cortex-gitnexus
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.gitnexus
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-gitnexus
          cache-to: type=gha,scope=cortex-gitnexus,mode=max

  # ── Auto-bump patch version after successful build ──
  bump-version:
    needs: [build-api, build-web, build-mcp, build-gitnexus]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        run: |
          chmod +x scripts/bump-version.sh
          scripts/bump-version.sh patch

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Two merges landing minutes apart race here: the second run's images
          # publish fine, then its push is rejected because master already moved
          # and the whole job is reported as failed. Recompute the bump on top of
          # whatever master is now instead — never force over the other run.
          for attempt in 1 2 3; do
            git add version.json
            git diff --cached --quiet && echo "No version change" && exit 0
            NEW_VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' version.json | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*')
            git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
            if git push; then exit 0; fi
            echo "push rejected on attempt ${attempt}; re-bumping on top of origin/${GITHUB_REF_NAME}"
            git reset --hard HEAD~1
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            scripts/bump-version.sh patch
          done
          echo "::error::version bump could not be pushed after 3 attempts"
          exit 1
