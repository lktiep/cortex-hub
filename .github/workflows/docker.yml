name: Build and Publish Docker Images

on:
  push:
    branches: [master]
    paths:
      - 'apps/dashboard-api/**'
      - 'apps/dashboard-web/**'
      - 'apps/hub-mcp/**'
      - 'packages/**'
      - 'infra/Dockerfile.*'
      - 'infra/nginx-dashboard.conf'
      # Baked into cortex-gitnexus by COPY in Dockerfile.gitnexus, so editing it
      # is a source change that needs a rebuild — same as nginx-dashboard.conf.
      - 'infra/gitnexus-entrypoint.sh'
      - 'version.json'
  # A stable release: run this by hand with `stable` on (scripts/release.sh does).
  # It claims a patch/minor/major version, builds under it, tags the images
  # `:stable` as well, and publishes git tag v<version> plus a GitHub Release on
  # the exact commit the images were built from.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to claim
        type: choice
        options: [patch, minor, major]
        default: patch
      stable:
        description: Publish as a stable release (git tag, GitHub Release, :stable images)
        type: boolean
        default: false

# ── One master build at a time ──
#
# Two merges landed within ten seconds and both builds pushed `:latest`. They
# finished in the other order, so `:latest` ended up carrying the *older* commit
# while both runs reported success, and watchtower deployed code that was missing
# the change merged after it. The commit a moving tag points at cannot be decided
# by whichever build happens to finish last.
#
# Queueing rather than cancelling, because each run also claims a version and
# pushes an immutable tag under it: a cancelled run would leave a claimed version
# with no images behind it. Runs start in trigger order, so the newest commit
# builds last and `:latest` ends up where it belongs.
concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── Claim the version these images will carry ──
  #
  # The bump used to run *after* the builds, so every build tagged itself with
  # the number the *previous* run had left behind. #22's images published as
  # v0.7.16 — the tag #21 had already published, with different content — and
  # v0.7.17 exists nowhere in the registry. A version tag two different builds
  # answer to is worse than no tag at all: pinning it is a coin toss, and a
  # rollback lands on whichever build pushed last. So claim the number first,
  # then build under it.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.claim.outputs.version }}
      # The commit every image is built from: the release commit, so that
      # v<version> in git, in the registry and in /health name the same tree.
      sha: ${{ steps.claim.outputs.sha }}
      date: ${{ steps.claim.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Claim the next version
        id: claim
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          read_version() {
            grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' version.json \
              | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*'
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/bump-version.sh

          # Two merges landing minutes apart race here: the second run's push is
          # rejected because master already moved. Re-claim on top of whatever
          # master is now instead — never force over the other run.
          claimed() {
            {
              echo "version=${VERSION}"
              echo "sha=$(git rev-parse HEAD)"
              echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          for attempt in 1 2 3; do
            scripts/bump-version.sh "${BUMP}"
            VERSION=$(read_version)
            git add version.json
            if git diff --cached --quiet; then
              echo "version.json already at v${VERSION}; building under it"
              claimed
            fi
            git commit -m "chore: release v${VERSION} [skip ci]"
            if git push; then
              echo "Building as v${VERSION} from $(git rev-parse --short HEAD)"
              claimed
            fi
            echo "push rejected on attempt ${attempt}; re-claiming on top of origin/${GITHUB_REF_NAME}"
            git reset --hard HEAD~1
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
          done
          echo "::error::could not claim a version after 3 attempts"
          exit 1

  # ── cortex-api (dashboard-api) ──
  build-api:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Tag and label from the checked-out release commit, not github.sha.
          context: git
          images: ${{ env.REGISTRY }}/lktiep/cortex-api
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=stable,enable=${{ inputs.stable == true }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.dashboard-api
          push: true
          build-args: |
            COMMIT_SHA=${{ needs.version.outputs.sha }}
            BUILD_DATE=${{ needs.version.outputs.date }}
            APP_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-api
          cache-to: type=gha,scope=cortex-api,mode=max

  # ── cortex-hub-web (dashboard-web) ──
  build-web:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Tag and label from the checked-out release commit, not github.sha.
          context: git
          images: ${{ env.REGISTRY }}/lktiep/cortex-hub-web
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=stable,enable=${{ inputs.stable == true }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.dashboard-web
          push: true
          build-args: |
            COMMIT_SHA=${{ needs.version.outputs.sha }}
            BUILD_DATE=${{ needs.version.outputs.date }}
            APP_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-hub-web
          cache-to: type=gha,scope=cortex-hub-web,mode=max

  # ── cortex-mcp (hub-mcp) ──
  build-mcp:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Tag and label from the checked-out release commit, not github.sha.
          context: git
          images: ${{ env.REGISTRY }}/lktiep/cortex-mcp
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=stable,enable=${{ inputs.stable == true }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.hub-mcp
          push: true
          build-args: |
            COMMIT_SHA=${{ needs.version.outputs.sha }}
            BUILD_DATE=${{ needs.version.outputs.date }}
            APP_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-mcp
          cache-to: type=gha,scope=cortex-mcp,mode=max

  # ── cortex-gitnexus ──
  build-gitnexus:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Tag and label from the checked-out release commit, not github.sha.
          context: git
          images: ${{ env.REGISTRY }}/lktiep/cortex-gitnexus
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=stable,enable=${{ inputs.stable == true }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.gitnexus
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-gitnexus
          cache-to: type=gha,scope=cortex-gitnexus,mode=max

  # ── Stable release: git tag + GitHub Release, once every image is published ──
  release:
    if: ${{ inputs.stable == true }}
    needs: [version, build-api, build-web, build-mcp, build-gitnexus]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag v${{ needs.version.outputs.version }} and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists; leaving it as it is"
            exit 0
          fi
          # Notes are generated from the PRs merged since the previous release;
          # edit them afterwards with `gh release edit v${VERSION} --notes-file ...`.
          gh release create "v${VERSION}" \
            --target "${SHA}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest
