name: Pages

# Builds the VitePress docs site in website/ and publishes it to GitHub Pages. The Conductor
# showcase ships inside it, from website/public/conductor/.
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # website/ is outside the pnpm workspace and has its own lockfile.
      - name: Install
        working-directory: website
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build
        working-directory: website
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website/.vitepress/dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
